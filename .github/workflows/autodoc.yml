name: AutoDoc Reusable Workflow

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  autodoc:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r autodoc/requirements.txt

      - name: Run AutoDoc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: autodoc
        run: python autodoc/analyzer/main.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-report
          path: reports/output.json

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-pdf
          path: reports/output.pdf

      - name: Auto approve PR if PASS
        run: |
          if grep -q '"final_status": "FAIL"' reports/output.json; then
            echo "FAIL detected → no approve"
            exit 0
          fi

          if grep -q '"final_status": "NEEDS REVIEW"' reports/output.json; then
            echo "Needs review → no approve"
            exit 0
          fi

          echo "All PASS → approving PR"

          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews \
            -d '{"event":"APPROVE"}'


  blocking-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - run: python -m analyzer.check_blocking
        env:
          PYTHONPATH: autodoc


  review-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - run: python -m analyzer.check_review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: autodoc