name: AutoDoc Reusable Workflow

on:
  workflow_call:
    inputs:
      override:
        description: "Override NEEDS REVIEW (true/false)"
        required: false
        type: string
        default: "false"
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  autodoc:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    outputs:
      report-path: reports/output.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout AutoDoc
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r autodoc/requirements.txt

      - name: Run AutoDoc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTODOC_OVERRIDE: ${{ inputs.override }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python autodoc/analyzer/main.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-report
          path: reports/output.json

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-pdf
          path: reports/output.pdf

  blocking-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - name: Checkout AutoDoc
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run blocking check
        run: python autodoc/analyzer/check_blocking.py

  review-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - name: Checkout AutoDoc
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run review check
        env:
          AUTODOC_OVERRIDE: ${{ inputs.override }}
        run: python autodoc/analyzer/check_review.py
