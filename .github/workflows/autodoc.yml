name: AutoDoc Reusable Workflow

on:
  workflow_call:
    inputs:
      pr_number:
        required: false
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to approve"
        required: true

jobs:
  autodoc:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      report-path: reports/output.json

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r autodoc/requirements.txt

      - name: Run AutoDoc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONPATH: autodoc
        run: python autodoc/analyzer/main.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-report
          path: reports/output.json

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-pdf
          path: reports/output.pdf


  blocking-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - run: python -m analyzer.check_blocking
        env:
          PYTHONPATH: autodoc


  review-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - run: python -m analyzer.check_review
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: autodoc