name: AutoDoc Documentation

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  autodoc:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r autodoc/requirements.txt

      - name: Run AutoDoc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: autodoc
        run: python autodoc/analyzer/main.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-report
          path: reports/output.json

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-pdf
          path: reports/output.pdf

      - name: Commit documentation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "AutoDoc Bot"
          git config user.email "autodoc@bot.com"

          git add docs/
          git commit -m "AutoDoc: update documentation" || echo "No changes"

          git push

  blocking-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run blocking check
        env:
          PYTHONPATH: autodoc
        run: python -m analyzer.check_blocking


  review-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run review check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: autodoc
        run: python -m analyzer.check_review


  final-approve:
    runs-on: ubuntu-latest
    needs:
      - autodoc
      - blocking-check
      - review-check

    permissions:
      contents: write
      pull-requests: write

    if: success()

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Check if all PASS
        id: check_pass
        run: |
          if grep -q '"final_status": "FAIL"' reports/output.json; then
            echo "all_pass=false" >> $GITHUB_OUTPUT
          elif grep -q '"final_status": "NEEDS REVIEW"' reports/output.json; then
            echo "all_pass=false" >> $GITHUB_OUTPUT
          else
            echo "all_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: Auto approve PR
        if: steps.check_pass.outputs.all_pass == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}