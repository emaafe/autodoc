name: AutoDoc Reusable Workflow

on:
  workflow_call:
    inputs:
      override:
        description: "Override NEEDS REVIEW"
        required: false
        type: string
        default: "false"
    secrets:
      GEMINI_API_KEY:
        required: true

  workflow_dispatch:
    inputs:
      override:
        description: "Override NEEDS REVIEW"
        required: true
        default: "false"

jobs:
  autodoc:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      report-path: reports/output.json

    steps:
      #Checkout repo cliente
      - name: Checkout target repository
        uses: actions/checkout@v4

      #Checkout AutoDoc (herramienta)
      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      #Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #Dependencias
      - name: Install dependencies
        run: pip install -r autodoc/requirements.txt

      #Ejecutar AutoDoc
      - name: Run AutoDoc
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTODOC_OVERRIDE: ${{ inputs.override }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: autodoc
        run: python autodoc/analyzer/main.py

      #JSON
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-report
          path: reports/output.json

      #PDF
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: autodoc-pdf
          path: reports/output.pdf


  blocking-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run blocking check
        env:
          PYTHONPATH: autodoc
        run: python -m analyzer.check_blocking


  review-check:
    runs-on: ubuntu-latest
    needs: autodoc

    steps:
      - name: Checkout AutoDoc source
        uses: actions/checkout@v4
        with:
          repository: emaafe/autodoc
          path: autodoc

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: autodoc-report
          path: reports/

      - name: Run review check
        env:
          AUTODOC_OVERRIDE: ${{ inputs.override }}
          PYTHONPATH: autodoc
        run: python -m analyzer.check_review